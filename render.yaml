# render.yaml — Render Blueprint (Infrastructure-as-Code)
# Deploy both backend and frontend from a single repo.
# Usage: Connect your GitHub repo on Render → it auto-detects this file.

services:
  # ── Backend (FastAPI + SQLite) ──
  - type: web
    name: incident-tracker-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

  # ── Frontend (React Static Site) ──
  - type: web
    name: incident-tracker
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://incident-tracker-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
